<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DP | FILMS — Admin Panel</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://i.postimg.cc/GtRtnqFf/DP-FILMS-LOGO.png">

  <!-- Typography: Jost & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">

  <style>
    /* Admin specific layout enhancements (using unified style.css tokens) */
    .admin-page-body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Auth Gate Modal */
    .admin-auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 14, 14, 0.95);
      backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .admin-auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .auth-error-banner {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      text-align: left;
      line-height: 1.45;
    }

    .auth-tab-row {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }

    .auth-tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: all var(--transition-fast);
    }

    .auth-tab-btn.active {
      background: var(--primary-accent);
      color: #ffffff;
    }

    /* Admin Workspace */
    .admin-app {
      display: none;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .admin-top-bar {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }

    .admin-master-detail {
      display: flex;
      flex: 1;
      height: calc(100vh - 64px);
      overflow: hidden;
    }

    /* Master Column */
    .admin-master-col {
      width: 420px;
      min-width: 320px;
      max-width: 480px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .master-toolbar {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .master-search-row {
      display: flex;
      align-items: center;
      position: relative;
    }

    .master-search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
    }

    .master-search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
    }

    .master-filter-row {
      display: flex;
      gap: 8px;
    }

    .master-filter-select {
      flex: 1;
      padding: 6px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.8rem;
      outline: none;
    }

    .submissions-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .sub-item {
      padding: 16px;
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background-color var(--transition-fast);
      position: relative;
    }

    .sub-item:hover {
      background: var(--bg-surface-elevated);
    }

    .sub-item.active {
      background: rgba(56, 178, 172, 0.12);
      border-left: 3px solid var(--primary-bright);
    }

    .sub-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .sub-item-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sub-unread-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-bright);
    }

    .sub-item-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .sub-item-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .tag-pill {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }

    .tag-status-new {
      background: rgba(56, 178, 172, 0.2);
      color: var(--primary-bright);
      border-color: rgba(56, 178, 172, 0.4);
    }

    .tag-status-talks {
      background: rgba(246, 200, 95, 0.15);
      color: var(--accent-award);
      border-color: rgba(246, 200, 95, 0.35);
    }

    .tag-status-accepted {
      background: rgba(34, 197, 94, 0.18);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.35);
    }

    .tag-status-rejected {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .sub-item-snippet {
      font-size: 0.85rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Detail Column */
    .admin-detail-col {
      flex: 1;
      background: var(--bg-page);
      overflow-y: auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    .detail-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-card);
      margin-bottom: 24px;
    }

    .detail-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .detail-applicant-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px;
      background: var(--bg-input);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .meta-item-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .meta-item-value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-all;
    }

    .detail-message-body {
      padding: 20px;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      margin-bottom: 24px;
    }

    .notes-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-subtle);
    }

    .notes-textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      background: var(--bg-input);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    /* Actions Bar */
    .detail-actions-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action-small {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .btn-action-small:hover {
      background: var(--primary-accent);
      border-color: var(--primary-bright);
    }

    .btn-action-danger {
      color: #fca5a5;
    }

    .btn-action-danger:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: #ef4444;
      color: #ffffff;
    }

    .btn-export-csv {
      padding: 6px 12px;
      background: rgba(56, 178, 172, 0.15);
      border: 1px solid rgba(56, 178, 172, 0.3);
      color: var(--primary-bright);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .btn-export-csv:hover {
      background: var(--primary-accent);
      color: #ffffff;
    }

    @media (max-width: 820px) {
      .admin-master-detail {
        flex-direction: column;
        height: auto;
        overflow: visible;
      }
      .admin-master-col {
        width: 100%;
        max-width: none;
        height: 380px;
      }
      .admin-detail-col {
        padding: 16px;
      }
    }
  </style>
</head>
<body class="admin-page-body">

  <!-- Firebase Script for Admin Panel -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc 
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { firebaseConfig, FIRESTORE_COLLECTION, ADMIN_EMAIL } from './config.js';

    let db = null;
    let auth = null;
    let submissions = [];
    let activeSubId = null;
    let searchFilter = '';
    let statusFilter = 'all';
    let roleFilter = 'all';

    const authOverlay = document.getElementById('admin-auth-overlay');
    const adminApp = document.getElementById('admin-app');
    const authErrorBox = document.getElementById('auth-error-box');
    const loginForm = document.getElementById('admin-login-form');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const btnGoogleAuth = document.getElementById('btn-google-auth');
    const tabEmail = document.getElementById('tab-btn-email');
    const tabGoogle = document.getElementById('tab-btn-google');
    const listContainer = document.getElementById('submissions-list-container');
    const emptyPlaceholder = document.getElementById('detail-empty-placeholder');
    const activeView = document.getElementById('detail-active-view');
    const btnExport = document.getElementById('btn-export-csv');

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);
    } catch (e) {
      console.warn('Firebase init note:', e);
    }

    // Auth tab toggles
    tabEmail?.addEventListener('click', () => {
      tabEmail.classList.add('active');
      tabGoogle.classList.remove('active');
      loginForm.style.display = 'flex';
      btnGoogleAuth.style.display = 'none';
    });

    tabGoogle?.addEventListener('click', () => {
      tabGoogle.classList.add('active');
      tabEmail.classList.remove('active');
      loginForm.style.display = 'none';
      btnGoogleAuth.style.display = 'flex';
    });

    const showError = (msg) => {
      if (authErrorBox) {
        authErrorBox.textContent = msg;
        authErrorBox.style.display = 'block';
      }
    };

    const clearError = () => {
      if (authErrorBox) {
        authErrorBox.textContent = '';
        authErrorBox.style.display = 'none';
      }
    };

    const authorizeAdmin = (email) => {
      if (email !== ADMIN_EMAIL) {
        showError(`Access denied. Account ${email} is not authorized. Must be ${ADMIN_EMAIL}.`);
        if (auth) signOut(auth);
        return false;
      }
      authOverlay.style.display = 'none';
      adminApp.style.display = 'flex';
      sessionStorage.setItem('dp_film_admin_auth', 'true');
      initDashboard();
      return true;
    };

    // Form Login
    loginForm?.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const email = emailInput?.value?.trim();
      const password = passInput?.value?.trim();

      // Check passcode fallback first (e.g. dominik2026)
      if (password === 'dominik2026' || password === 'DominikAdmin2026!') {
        authorizeAdmin(email);
        return;
      }

      // Try Firebase Auth
      if (auth) {
        try {
          const res = await signInWithEmailAndPassword(auth, email, password);
          authorizeAdmin(res.user.email);
        } catch (err) {
          // If user doesn't exist yet in Auth, accept the configured passcode
          showError('Invalid login or password: ' + err.message);
        }
      }
    });

    // Google Sign-In
    btnGoogleAuth?.addEventListener('click', async () => {
      clearError();
      if (!auth) return;
      try {
        const provider = new GoogleAuthProvider();
        const res = await signInWithPopup(auth, provider);
        authorizeAdmin(res.user.email);
      } catch (err) {
        showError('Google sign in error: ' + err.message);
      }
    });

    document.getElementById('btn-admin-logout')?.addEventListener('click', () => {
      sessionStorage.removeItem('dp_film_admin_auth');
      if (auth) signOut(auth);
      window.location.reload();
    });

    // Restore active session
    if (sessionStorage.getItem('dp_film_admin_auth') === 'true') {
      authorizeAdmin(ADMIN_EMAIL);
    } else if (auth) {
      onAuthStateChanged(auth, (user) => {
        if (user && user.email === ADMIN_EMAIL) {
          authorizeAdmin(user.email);
        }
      });
    }

    // ======================================================================
    // Dashboard Data & Submissions Real-Time Logic
    // ======================================================================
    function initDashboard() {
      // 1. Fetch from Express fallback API
      fetchSubmissionsApi();

      // 2. Real-time Firestore query
      if (db) {
        try {
          const q = query(collection(db, FIRESTORE_COLLECTION), orderBy('createdAt', 'desc'));
          onSnapshot(q, (snapshot) => {
            snapshot.forEach((d) => {
              const data = { id: d.id, ...d.data() };
              const idx = submissions.findIndex(s => s.id === d.id);
              if (idx >= 0) {
                submissions[idx] = { ...submissions[idx], ...data };
              } else {
                submissions.unshift(data);
              }
            });
            renderList();
            if (activeSubId) {
              const curr = submissions.find(s => s.id === activeSubId);
              if (curr) renderDetail(curr);
            }
          }, (err) => {
            console.warn('Firestore snapshot note:', err);
          });
        } catch (e) {
          console.warn('Snapshot listener notice:', e);
        }
      }
    }

    async function fetchSubmissionsApi() {
      try {
        const res = await fetch('/api/admin/submissions');
        if (res.ok) {
          const data = await res.json();
          if (data.submissions) {
            const map = new Map();
            submissions.forEach(s => map.set(s.id, s));
            data.submissions.forEach(s => map.set(s.id, s));
            submissions = Array.from(map.values());
            renderList();
          }
        }
      } catch (e) {}
    }

    function renderList() {
      const q = searchFilter.toLowerCase();

      let filtered = submissions.filter(item => {
        if (statusFilter !== 'all' && (item.status || 'new') !== statusFilter) return false;
        if (roleFilter !== 'all' && (item.role || '') !== roleFilter) return false;

        if (q) {
          const name = (item.name || '').toLowerCase();
          const country = (item.country || '').toLowerCase();
          const role = (item.role || '').toLowerCase();
          const msg = (item.message || '').toLowerCase();
          return name.includes(q) || country.includes(q) || role.includes(q) || msg.includes(q);
        }
        return true;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div style="padding: 32px 16px; text-align: center; color: var(--text-muted); font-size: 0.88rem;">
            No applications match current filters.
          </div>
        `;
        return;
      }

      listContainer.innerHTML = filtered.map(item => {
        const isSelected = item.id === activeSubId;
        const status = item.status || 'new';
        const role = item.role || 'Other';
        const country = item.country || '';

        let dateStr = 'Recent';
        if (item.createdAt?.toDate) {
          dateStr = item.createdAt.toDate().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        } else if (item.createdAtIso) {
          dateStr = new Date(item.createdAtIso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        return `
          <li class="sub-item ${isSelected ? 'active' : ''}" data-id="${item.id}">
            <div class="sub-item-header">
              <span class="sub-item-name">
                ${item.unread ? '<span class="sub-unread-dot"></span>' : ''}
                ${escapeHtml(item.name || 'Anonymous')}
              </span>
              <span class="sub-item-date">${dateStr}</span>
            </div>
            <div class="sub-item-tags">
              <span class="tag-pill tag-status-${status}">${status.replace('_', ' ')}</span>
              <span class="tag-pill">${escapeHtml(role)}</span>
              ${country ? `<span class="tag-pill">${escapeHtml(country)}</span>` : ''}
              ${item.fileName ? '<span class="tag-pill" style="color: var(--primary-bright);">📄 File</span>' : ''}
            </div>
            <p class="sub-item-snippet">${escapeHtml(item.message || '')}</p>
          </li>
        `;
      }).join('');

      listContainer.querySelectorAll('.sub-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          selectSubmission(id);
        });
      });
    }

    function selectSubmission(id) {
      activeSubId = id;
      const item = submissions.find(s => s.id === id);
      if (!item) return;

      if (item.unread) {
        item.unread = false;
        if (db) {
          try { updateDoc(doc(db, FIRESTORE_COLLECTION, id), { unread: false }); } catch(e) {}
        }
        fetch(`/api/admin/submissions/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ unread: false })
        }).catch(() => {});
      }

      renderList();
      renderDetail(item);
    }

    function renderDetail(item) {
      emptyPlaceholder.style.display = 'none';
      activeView.style.display = 'block';

      const fileUrl = item.fileUrl || item.fileDataUrl;
      const contactVal = item.handle || '';
      const isEmail = item.contactType === 'Email';

      activeView.innerHTML = `
        <div class="detail-card">
          <div class="detail-header-row">
            <div>
              <h2 class="detail-applicant-title">${escapeHtml(item.name || 'Anonymous')}</h2>
              <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px;">
                <span class="tag-pill tag-status-${item.status || 'new'}" style="font-size: 0.85rem; padding: 4px 10px;">
                  ${(item.status || 'new').toUpperCase()}
                </span>
                <span class="tag-pill" style="font-size: 0.85rem; padding: 4px 10px;">${escapeHtml(item.role || 'Role')}</span>
                <span class="tag-pill" style="font-size: 0.85rem; padding: 4px 10px;">${escapeHtml(item.country || 'Global')}</span>
              </div>
            </div>

            <div style="display: flex; gap: 8px; align-items: center;">
              <select id="update-status-select" class="form-select" style="padding: 8px 12px; font-size: 0.88rem; width: auto;">
                <option value="new" ${item.status === 'new' ? 'selected' : ''}>Status: New</option>
                <option value="in_talks" ${item.status === 'in_talks' ? 'selected' : ''}>Status: In Talks</option>
                <option value="accepted" ${item.status === 'accepted' ? 'selected' : ''}>Status: Accepted</option>
                <option value="rejected" ${item.status === 'rejected' ? 'selected' : ''}>Status: Rejected</option>
              </select>

              <button type="button" class="btn-action-small btn-action-danger" id="btn-delete-sub">
                Delete
              </button>
            </div>
          </div>

          <div class="detail-meta-grid">
            <div>
              <div class="meta-item-label">Preferred Contact</div>
              <div class="meta-item-value">${escapeHtml(item.contactType || 'Contact')}: ${escapeHtml(contactVal)}</div>
            </div>
            <div>
              <div class="meta-item-label">Type</div>
              <div class="meta-item-value">${escapeHtml(item.type || 'Application')}</div>
            </div>
            <div>
              <div class="meta-item-label">Country</div>
              <div class="meta-item-value">${escapeHtml(item.country || 'Not specified')}</div>
            </div>
            <div>
              <div class="meta-item-label">Attachment</div>
              <div class="meta-item-value">
                ${fileUrl ? `<a href="${fileUrl}" target="_blank" download="${escapeHtml(item.fileName || 'file')}" style="color: var(--primary-bright); text-decoration: underline;">${escapeHtml(item.fileName || 'Download attachment')} ↗</a>` : (item.fileName ? escapeHtml(item.fileName) : 'None')}
              </div>
            </div>
          </div>

          <div class="meta-item-label" style="margin-bottom: 8px;">Message / Proposal</div>
          <div class="detail-message-body">${escapeHtml(item.message || '')}</div>

          <!-- Actions: Quick Email Reply & Copy Contact -->
          <div class="detail-actions-bar">
            ${isEmail ? `
              <a href="mailto:${escapeHtml(contactVal)}?subject=${encodeURIComponent('DP | FILMS — Short Film Collaboration')}&body=${encodeURIComponent(`Hi ${item.name || ''},\n\nThank you for reaching out to join the film team. I reviewed your background as ${item.role || 'an artist'} and would love to connect.\n\nBest regards,\nDominik Šuškevič\nDP | FILMS\ninfo@dominikphotofficial.lt`)}" class="btn-primary" style="padding: 10px 18px; font-size: 0.9rem;">
                ✉ Reply by Email (mailto)
              </a>
            ` : ''}

            <button type="button" class="btn-secondary" id="btn-copy-contact" style="padding: 10px 18px; font-size: 0.9rem;">
              📋 Copy Contact (${escapeHtml(contactVal)})
            </button>
          </div>

          <!-- Private Notes Section -->
          <div class="notes-box">
            <div class="meta-item-label">Private Admin Notes</div>
            <textarea id="admin-notes-input" class="notes-textarea" placeholder="Add private notes on this applicant (e.g. portfolio impressions, audition notes, ideas)...">${escapeHtml(item.notes || '')}</textarea>
            <button type="button" class="btn-action-small" id="btn-save-notes" style="margin-top: 8px;">Save Notes</button>
            <span id="notes-status" style="font-size: 0.8rem; color: var(--primary-bright); margin-left: 8px;"></span>
          </div>
        </div>
      `;

      // Status change
      document.getElementById('update-status-select')?.addEventListener('change', async (e) => {
        const newStatus = e.target.value;
        item.status = newStatus;
        if (db) {
          try { await updateDoc(doc(db, FIRESTORE_COLLECTION, item.id), { status: newStatus }); } catch(e) {}
        }
        fetch(`/api/admin/submissions/${item.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        }).catch(() => {});
        renderList();
      });

      // Copy contact
      document.getElementById('btn-copy-contact')?.addEventListener('click', () => {
        navigator.clipboard.writeText(contactVal).then(() => {
          alert('Copied contact: ' + contactVal);
        }).catch(() => {
          prompt('Copy contact:', contactVal);
        });
      });

      // Save Notes
      document.getElementById('btn-save-notes')?.addEventListener('click', async () => {
        const notesVal = document.getElementById('admin-notes-input')?.value || '';
        item.notes = notesVal;
        const statusSpan = document.getElementById('notes-status');
        if (db) {
          try { await updateDoc(doc(db, FIRESTORE_COLLECTION, item.id), { notes: notesVal }); } catch(e) {}
        }
        fetch(`/api/admin/submissions/${item.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: notesVal })
        }).catch(() => {});
        if (statusSpan) {
          statusSpan.textContent = '✓ Saved';
          setTimeout(() => { statusSpan.textContent = ''; }, 2500);
        }
      });

      // Delete
      document.getElementById('btn-delete-sub')?.addEventListener('click', async () => {
        if (!confirm('Are you sure you want to permanently delete this application?')) return;
        submissions = submissions.filter(s => s.id !== item.id);
        activeSubId = null;
        emptyPlaceholder.style.display = 'block';
        activeView.style.display = 'none';
        renderList();

        if (db) {
          try { await deleteDoc(doc(db, FIRESTORE_COLLECTION, item.id)); } catch(e) {}
        }
        fetch(`/api/admin/submissions/${item.id}`, { method: 'DELETE' }).catch(() => {});
      });
    }

    // Filters
    document.getElementById('admin-search')?.addEventListener('input', (e) => {
      searchFilter = e.target.value;
      renderList();
    });

    document.getElementById('filter-status')?.addEventListener('change', (e) => {
      statusFilter = e.target.value;
      renderList();
    });

    document.getElementById('filter-role')?.addEventListener('change', (e) => {
      roleFilter = e.target.value;
      renderList();
    });

    // CSV Export
    btnExport?.addEventListener('click', () => {
      if (submissions.length === 0) {
        alert('No submissions to export.');
        return;
      }
      const headers = ['ID', 'Date', 'Name', 'Role', 'Country', 'Contact Type', 'Contact', 'Status', 'Notes', 'Message'];
      const rows = submissions.map(s => [
        s.id,
        s.createdAtIso || '',
        `"${(s.name || '').replace(/"/g, '""')}"`,
        `"${(s.role || '').replace(/"/g, '""')}"`,
        `"${(s.country || '').replace(/"/g, '""')}"`,
        `"${(s.contactType || '').replace(/"/g, '""')}"`,
        `"${(s.handle || '').replace(/"/g, '""')}"`,
        s.status || 'new',
        `"${(s.notes || '').replace(/"/g, '""')}"`,
        `"${(s.message || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `dp_films_team_applications_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
